<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Checkmark Audio — Logo Visualizer Draft</title>
<style>
  :root {
    --bg: #0b0a08;
    --gold-deep: #a96c22;
    --gold-mid: #e5bd6d;
    --gold-hi: #f5dc9b;
    --ink: #eee6da;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  #logoWrap {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: var(--logo-size, 220px);
    height: var(--logo-size, 220px);
    cursor: pointer;
    will-change: transform;
  }
  #logoGlow {
    position: absolute; inset: -45%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(240, 205, 130, 0.35) 0%, rgba(240, 205, 130, 0.08) 45%, transparent 70%);
    opacity: 0;
    will-change: opacity, transform;
    pointer-events: none;
  }
  #logo {
    position: absolute; inset: 8%;
    width: 84%; height: 84%;
    object-fit: contain;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
  }

  #controls {
    position: fixed;
    left: 50%; bottom: 28px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(16, 16, 14, 0.72);
    border: 1px solid rgba(240, 207, 136, 0.28);
    border-radius: 999px;
    padding: 10px 16px;
    backdrop-filter: blur(8px);
    z-index: 5;
  }
  #controls select, #controls button, #controls label {
    background: transparent;
    color: var(--ink);
    border: 1px solid rgba(240, 207, 136, 0.35);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  #controls select { max-width: 220px; }
  #controls select option { background: #171511; }
  #controls button:hover, #controls label:hover { border-color: var(--gold-hi); color: var(--gold-hi); }
  #playBtn { min-width: 78px; }
  #fileInput { display: none; }

  #hint {
    position: fixed;
    left: 50%; top: calc(50% + clamp(150px, 24vmin, 260px));
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #d6a85e;
    opacity: 0.85;
    transition: opacity 0.6s ease;
    pointer-events: none;
    z-index: 4;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="viz"></canvas>
  <div id="logoWrap" title="Play / pause">
    <div id="logoGlow"></div>
    <img id="logo" src="../../../MEDIA/IMAGES/checkmark-audio-logo-official-gold-gradient-transparent.png" alt="Checkmark Audio">
  </div>
  <div id="hint">Press play</div>
</div>

<div id="controls">
  <button id="playBtn">Play</button>
  <select id="trackSelect"></select>
  <label for="fileInput">Load file</label>
  <input type="file" id="fileInput" accept="audio/*">
</div>

<audio id="player" crossorigin="anonymous" loop></audio>

<script>
(() => {
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');
  const player = document.getElementById('player');
  const playBtn = document.getElementById('playBtn');
  const trackSelect = document.getElementById('trackSelect');
  const fileInput = document.getElementById('fileInput');
  const logoWrap = document.getElementById('logoWrap');
  const logoGlow = document.getElementById('logoGlow');
  const hint = document.getElementById('hint');

  let audioCtx = null, analyser = null, freqData = null;
  let W = 0, H = 0, dpr = 1;

  // Full-circle radial spectrum. A modest number of wide frequency bands,
  // interleaved around the ring with coprime stepping (13/32) so low, mid,
  // and high energy land evenly all around — balanced overall, organically
  // asymmetric. Few control points keep the silhouette flowing, not jagged.
  const BAR_COUNT = 32;
  const ANGLE_ORDER = new Array(BAR_COUNT);
  for (let i = 0; i < BAR_COUNT; i++) ANGLE_ORDER[i] = (i * 13) % BAR_COUNT;
  const smoothBars = new Float32Array(BAR_COUNT);
  const drawn = new Float32Array(BAR_COUNT);
  let bassLevel = 0;      // smoothed low-end energy, drives the logo pulse
  let energyLevel = 0;    // smoothed broadband energy, drives the ring

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const logoSize = Math.round(Math.min(W, H) * 0.16);
    logoWrap.style.setProperty('--logo-size', logoSize + 'px');
  }
  window.addEventListener('resize', resize);
  resize();

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(player);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.68;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }

  // Map each bar to a log-spaced frequency band (40 Hz – 15 kHz).
  function barValue(i) {
    const nyquist = audioCtx.sampleRate / 2;
    const fMin = 40, fMax = 15000;
    const f0 = fMin * Math.pow(fMax / fMin, i / BAR_COUNT);
    const f1 = fMin * Math.pow(fMax / fMin, (i + 1) / BAR_COUNT);
    let b0 = Math.floor(f0 / nyquist * freqData.length);
    let b1 = Math.max(b0 + 1, Math.ceil(f1 / nyquist * freqData.length));
    let sum = 0;
    for (let b = b0; b < b1 && b < freqData.length; b++) sum += freqData[b];
    return (sum / (b1 - b0)) / 255;
  }

  function draw() {
    requestAnimationFrame(draw);
    ctx.clearRect(0, 0, W, H);
    if (!analyser) return;

    analyser.getByteFrequencyData(freqData);

    // Low-end energy (roughly < 150 Hz) for the pulse.
    const nyquist = audioCtx.sampleRate / 2;
    const bassBins = Math.max(4, Math.round(150 / nyquist * freqData.length));
    let bass = 0;
    for (let i = 0; i < bassBins; i++) bass += freqData[i];
    bass = bass / bassBins / 255;
    bassLevel += (bass - bassLevel) * (bass > bassLevel ? 0.6 : 0.16);

    let energy = 0;
    for (let i = 0; i < BAR_COUNT; i++) {
      const v = barValue(i);
      smoothBars[i] += (v - smoothBars[i]) * (v > smoothBars[i] ? 0.65 : 0.22);
      energy += smoothBars[i];
    }
    energy /= BAR_COUNT;
    energyLevel += (energy - energyLevel) * 0.15;

    const cx = W / 2, cy = H / 2;
    const logoR = Math.min(W, H) * 0.082;
    const innerR = logoR * 1.42 * (1 + bassLevel * 0.05);
    const maxLen = Math.min(W, H) * 0.12;

    // Ambient layered halo: the reactive radii become one smooth silhouette,
    // rendered three times — a wide blurred aura, a mid glow, and a soft
    // inner body with a whisper of outline. Slow smoothing upstream makes it
    // breathe rather than flicker.
    // Steep curve: averages sit low near the logo, real peaks throw far.
    for (let i = 0; i < BAR_COUNT; i++) drawn[i] = Math.pow(smoothBars[ANGLE_ORDER[i]], 2.6);
    const rOff = new Float32Array(BAR_COUNT);
    for (let i = 0; i < BAR_COUNT; i++) {
      const m1 = drawn[(i + BAR_COUNT - 1) % BAR_COUNT];
      const p1 = drawn[(i + 1) % BAR_COUNT];
      rOff[i] = 4 + ((m1 + 2 * drawn[i] + p1) / 4) * maxLen;
    }
    // rot rotates the whole silhouette; rippleFreq/Phase/Amp add a gentle
    // traveling wave on top of the spectrum shape.
    function haloPath(scale, rot = 0, rippleFreq = 0, ripplePhase = 0, rippleAmp = 0) {
      const px = new Float32Array(BAR_COUNT), py = new Float32Array(BAR_COUNT);
      for (let i = 0; i < BAR_COUNT; i++) {
        const frac = (i + 0.5) / BAR_COUNT;
        let r = innerR + rOff[i] * scale;
        if (rippleAmp) r += Math.sin(frac * Math.PI * 2 * rippleFreq + ripplePhase) * rippleAmp;
        const ang = -Math.PI / 2 + frac * Math.PI * 2 + rot;
        px[i] = cx + Math.cos(ang) * r;
        py[i] = cy + Math.sin(ang) * r;
      }
      ctx.beginPath();
      ctx.moveTo((px[BAR_COUNT - 1] + px[0]) / 2, (py[BAR_COUNT - 1] + py[0]) / 2);
      for (let i = 0; i < BAR_COUNT; i++) {
        const j = (i + 1) % BAR_COUNT;
        ctx.quadraticCurveTo(px[i], py[i], (px[i] + px[j]) / 2, (py[i] + py[j]) / 2);
      }
      ctx.closePath();
    }
    function haloFill(alphaMul) {
      const fill = ctx.createRadialGradient(cx, cy, innerR * 0.9, cx, cy, innerR + maxLen * 1.3);
      fill.addColorStop(0, 'rgba(169, 108, 34, ' + ((0.10 + energyLevel * 0.14) * alphaMul).toFixed(3) + ')');
      fill.addColorStop(0.55, 'rgba(229, 189, 109, ' + ((0.13 + energyLevel * 0.20) * alphaMul).toFixed(3) + ')');
      fill.addColorStop(1, 'rgba(245, 220, 155, ' + ((0.05 + energyLevel * 0.10) * alphaMul).toFixed(3) + ')');
      return fill;
    }
    ctx.save();
    // Outer aura — widest, heavily blurred, faint.
    ctx.filter = 'blur(26px)';
    haloPath(1.45);
    ctx.fillStyle = haloFill(0.7);
    ctx.fill();
    // Mid glow.
    ctx.filter = 'blur(10px)';
    haloPath(1.12);
    ctx.fillStyle = haloFill(0.85);
    ctx.fill();
    // Inner body — soft edge.
    ctx.filter = 'blur(3px)';
    haloPath(0.82);
    ctx.fillStyle = haloFill(1);
    ctx.fill();
    // Twin dissonant lines: two thin outlines tracing the same silhouette
    // with opposite slow rotations and different traveling ripples, so they
    // weave and cross as the music moves.
    const t = performance.now() / 1000;
    ctx.filter = 'none';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 1;
    haloPath(0.90, Math.sin(t * 0.31) * 0.10, 5, t * 1.2, 2.5 + energyLevel * 5);
    ctx.strokeStyle = 'rgba(245, 220, 155, ' + (0.30 + energyLevel * 0.30).toFixed(3) + ')';
    ctx.stroke();
    haloPath(0.97, -Math.sin(t * 0.23 + 1.1) * 0.10, 3, -t * 1.7, 2.5 + energyLevel * 5);
    ctx.strokeStyle = 'rgba(214, 168, 94, ' + (0.28 + energyLevel * 0.28).toFixed(3) + ')';
    ctx.stroke();
    ctx.restore();
    // Feathered punch-out of the logo disc so the halo fades in around it.
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    const punch = ctx.createRadialGradient(cx, cy, innerR * 0.8, cx, cy, innerR + 14);
    punch.addColorStop(0, 'rgba(0,0,0,1)');
    punch.addColorStop(0.75, 'rgba(0,0,0,1)');
    punch.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = punch;
    ctx.beginPath();
    ctx.arc(cx, cy, innerR + 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Faint breathing ring on the inner edge of the halo.
    ctx.beginPath();
    ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(214, 168, 94,' + (0.14 + bassLevel * 0.30).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Logo pulse + glow.
    const scale = 1 + bassLevel * 0.085;
    logoWrap.style.transform = 'translate(-50%, -50%) scale(' + scale.toFixed(4) + ')';
    logoGlow.style.opacity = (0.25 + bassLevel * 0.75).toFixed(3);
  }
  requestAnimationFrame(draw);

  async function togglePlay() {
    ensureAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (!player.src) player.src = trackSelect.value;
    if (player.paused) {
      await player.play();
      playBtn.textContent = 'Pause';
      hint.classList.add('hidden');
    } else {
      player.pause();
      playBtn.textContent = 'Play';
    }
  }

  playBtn.addEventListener('click', togglePlay);
  logoWrap.addEventListener('click', togglePlay);

  // Auto-populate the track list from MEDIA/AUDIO/ — drop a song file in that
  // folder and it appears here on reload. Falls back to one known track if the
  // server doesn't provide a directory listing.
  const AUDIO_DIR = '../../../MEDIA/AUDIO/';
  function prettify(name) {
    return decodeURIComponent(name)
      .replace(/\.(mp3|wav|m4a|ogg|flac)$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase())
      .trim();
  }
  (async () => {
    try {
      const res = await fetch(AUDIO_DIR);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const files = [...doc.querySelectorAll('a')]
        .map(a => a.getAttribute('href'))
        .filter(h => h && /\.(mp3|wav|m4a|ogg|flac)$/i.test(h));
      if (!files.length) throw new Error('no audio files listed');
      for (const f of files) {
        const opt = document.createElement('option');
        opt.value = AUDIO_DIR + f;
        opt.textContent = prettify(f);
        trackSelect.appendChild(opt);
      }
    } catch (e) {
      const opt = document.createElement('option');
      opt.value = AUDIO_DIR + '01-hearts-with-fire.mp3';
      opt.textContent = 'Hearts With Fire';
      trackSelect.appendChild(opt);
    }
  })();

  trackSelect.addEventListener('change', async () => {
    ensureAudio();
    player.src = trackSelect.value;
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    await player.play();
    playBtn.textContent = 'Pause';
    hint.classList.add('hidden');
  });

  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0];
    if (!f) return;
    ensureAudio();
    player.src = URL.createObjectURL(f);
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    await player.play();
    playBtn.textContent = 'Pause';
    hint.classList.add('hidden');
  });
})();
</script>
</body>
</html>
